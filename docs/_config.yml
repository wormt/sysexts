title: "wormt.github.io (sysexts)"
description: "Sysexts for Wormt"
baseurl: "/sysexts"
url: "https://wormt.github.io"
permalink: "/:title/"
markdown: "kramdown"
kramdown:
  typographic_symbols:
    ndash: "--"
    mdash: "---"

remote_theme: just-the-docs/just-the-docs@v0.8.1
plugins:
  - jekyll-remote-theme

# Exclude from processing.
exclude:
  - justfile
  - Gemfile
  - Gemfile.lock
  - vendor

# Aux links for the upper right navigation
aux_links:
  "Sources on GitHub":
    - "https://github.com/wormt/sysexts"

# Footer last edited timestamp
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
